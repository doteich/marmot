# Eclipse Mosquitto Configuration for Marmot Edge Testing

# Standard MQTT listener (Plain TCP)
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# MQTT over WebSockets listener (e.g. for browser testing / web debuggers)
listener 9002 0.0.0.0
protocol websockets
allow_anonymous true

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
